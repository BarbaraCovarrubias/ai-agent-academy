services:
  pgvector_db:
    image: pgvector/pgvector:pg16
    container_name: agent_academy_pgvector
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-academy_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-academy_pass}
      POSTGRES_DB: ${POSTGRES_DB:-agent_academy}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata:
