services:
  postgres-pgvector:
    image: pgvector/pgvector:pg16
    container_name: agent_academy_pgvector
    restart: unless-stopped
    environment:
      POSTGRES_USER: academy_admin
      POSTGRES_PASSWORD: academy_secure_pass_2026
      POSTGRES_DB: agent_academy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata: